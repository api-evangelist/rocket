name: Rocket
description: >-
  Rocket (rocket.new) is an AI "vibe solutioning" platform for builders and founders that
  combines three products: Solve for market research and business analysis, Build for
  turning natural-language prompts or Figma designs into production-ready React, Next.js,
  and Flutter web and mobile apps, and Intelligence for tracking competitors across
  product, hiring, and funding signals. Build ships apps with one-click deploy to Netlify,
  custom domains, APK/App Store packaging, GitHub two-way code sync, and 26+ connectors
  (Stripe, Supabase, OpenAI, Anthropic, Twilio, HubSpot, and more) wired into the generated
  app from chat. Rocket is a no-code/AI app-builder product surface: it consumes external
  APIs (imported via Postman, cURL, or Swagger) rather than publishing its own public REST
  API, SDK, CLI, or MCP server. Backed by Accel, Electric Capital, and Sierra Ventures.
